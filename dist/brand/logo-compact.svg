<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
    <!-- Standalone Symbol centered top -->
    
    <g transform="translate(28.0, 14.0) scale(1.0)">
        <!-- Outer Precision Ring with 45-degree Notch at Top-Right -->
        <!-- Starts at 25 deg, sweeps clockwise 310 deg to 85 deg -->
        <path d="M 48.97 15.03 A 24 24 0 1 1 43.6 10.4" 
              fill="none" stroke="#0A0D14" stroke-width="6.5" stroke-linecap="round"/>
        <!-- Pulse Core: High-velocity transaction node positioned in the aperture -->
        <circle cx="49.5" cy="14.5" r="4.8" fill="#2563EB"/>
        <!-- Subtle Inner Focus Ring -->
        <circle cx="32" cy="32" r="8" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3" opacity="0.4"/>
    </g>
    
    <!-- ManageO Typographic Subtitle -->
    <text x="60" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-weight="800" font-size="16" letter-spacing="1.5" fill="#0A0D14">MANAGEO</text>
</svg>